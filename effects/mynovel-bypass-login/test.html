<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bypass Login Test — mynovel.co</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; display: flex; flex-direction: column; }
    #overlay { padding: 24px; background: #0f0f23; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; z-index: 9999; flex-shrink: 0; }
    #overlay h1 { font-size: 24px; margin-bottom: 8px; color: #f5c518; }
    #overlay p { margin: 6px 0; color: #aaa; font-size: 13px; }
    #overlay .highlight { color: #4ecdc4; }
    #overlay .success { color: #4caf50; font-weight: bold; }
    #overlay .error { color: #f44336; font-weight: bold; }
    #overlay .warning { color: #ff9800; font-weight: bold; }
    #overlay code { background: #16213e; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; }
    #overlay button { margin-top: 12px; margin-right: 8px; padding: 10px 18px; background: #f5c518; color: #000; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
    #overlay button:hover { background: #e0b10c; }
    #overlay button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
    #results { margin-top: 16px; max-height: 300px; overflow-y: auto; font-size: 12px; }
    #results div { padding: 4px 8px; border-bottom: 1px solid #2a2a4a; }
    #status-bar { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.85); color: #fff; padding: 10px 14px; border-radius: 8px; font-family: monospace; font-size: 11px; z-index: 10000; max-width: 280px; }
    #status-bar .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    #status-bar .dot.green { background: #4caf50; }
    #status-bar .dot.red { background: #f44336; }
    #status-bar .dot.yellow { background: #ff9800; }
    #status-bar .dot.gray { background: #9e9e9e; }
    #status-bar .blink { animation: blink 1.2s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>

<div id="overlay">
  <h1>🧪 Bypass Login Test — mynovel.co</h1>
  <p><strong>Testing:</strong> Hide login modal when coins ≥ 10</p>
  <p><strong>Method:</strong> Inject JS via <code>&lt;script&gt;[content]&lt;/script&gt;</code> into a new tab</p>

  <div id="results"></div>

  <button onclick="runTest()" id="btn-run">Run Test</button>
  <button onclick="toggleBypass(false)" id="btn-hide">Hide Modals</button>
  <button onclick="toggleBypass(true)" id="btn-show">Show Modals</button>
</div>

<div id="status-bar"><span class="dot gray"></span>Waiting...</div>

<script>
(function() {
  "use strict";

  const CONFIG = {
    MIN_COINS: 10,
    MODAL_SELECTORS: ["[data-modal=\"login\"]", "[data-modal=\"auth\"]", ".login-modal", ".modal-login", "#login-modal"],
    COIN_SELECTORS: ["[data-coin]", "[data-credits]", ".coin-count", ".credits", "[data-coins]", ".coins"],
    MYNODEL_URL: "https://mynovel.co",
    SCRIPT_SRC: "https://raw.githubusercontent.com/redevrx/mangax-effects/refs/heads/main/effects/mynovel-bypass-login/main.js"
  };

  let isBypassed = false;
  let observer = null;
  let mynovelTab = null;
  let bypassScript = null;
  let bypassScriptNode = null;

  function setStatus(text, type = "info") {
    const dot = document.querySelector("#status-bar .dot");
    const textEl = document.getElementById("status-text");
    const status = document.getElementById("status-bar");
    textEl.textContent = text;
    textEl.className = type === "success" ? "success" : type === "error" ? "error" : type === "warning" ? "warning" : "highlight";
    status.classList.remove("green", "red", "yellow", "gray", "blink");
    status.classList.add("dot", type === "success" ? "green" : type === "error" ? "red" : type === "warning" ? "yellow" : "gray");
    status.classList.toggle("blink", type === "info");
  }

  function getCoinCount() {
    for (const selector of CONFIG.COIN_SELECTORS) {
      const el = document.querySelector(selector);
      if (el) {
        const text = el.textContent || el.innerText || "";
        const match = text.match(/(\d+)/);
        if (match) return parseInt(match[1], 10);
      }
    }
    return 0;
  }

  function shouldBypass() {
    return getCoinCount() >= CONFIG.MIN_COINS;
  }

  function hideModal(modal) {
    if (modal.hidden) return;
    modal.classList.add("hidden");
    modal.style.display = "none";
    modal.setAttribute("aria-hidden", "true");
  }

  function restoreModal(modal) {
    if (!modal.hidden) return;
    modal.classList.remove("hidden");
    modal.style.display = "";
    modal.removeAttribute("aria-hidden");
    isBypassed = false;
  }

  function log(msg, type = "") {
    const div = document.createElement("div");
    div.style.marginBottom = "4px";
    const color = type === "success" ? "#4caf50" : type === "error" ? "#f44336" : type === "warning" ? "#ff9800" : "#9e9e9e";
    div.innerHTML = "<span>" + msg + "</span><span style='color:" + color + "'>[" + type.toUpperCase() + "]</span>";
    document.getElementById("results").appendChild(div);
  }

  function switchToMynovel() {
    if (!mynovelTab) {
      mynovelTab = window.open(CONFIG.MYNODEL_URL, "_blank");
      if (!mynovelTab) {
        log("❌ Failed to open tab. Allow popups in Chrome DevTools.", "error");
        alert("Please allow popups in Chrome DevTools, then refresh this page.");
        return;
      }
    }
    mynovelTab.focus();
  }

  function switchToThis() {
    window.focus();
  }

  function injectBypassScript() {
    const script = document.createElement("script");
    script.src = CONFIG.SCRIPT_SRC;
    bypassScript = script;
    bypassScriptNode = script;
    document.body.appendChild(script);
    log("📄 Injected bypass script into mynovel.co tab", "success");

    script.onload = function() {
      log("✅ Bypass script loaded successfully", "success");
      setTimeout(function() {
        runBypass();
      }, 500);
    };

    script.onerror = function() {
      log("❌ Failed to load bypass script. Check console for errors.", "error");
    };
  }

  function runBypass() {
    isBypassed = true;
    setStatus("🔧 Applying bypass...", "info");

    setTimeout(function() {
      const coins = getCoinCount();
      log("💰 Coins detected: <strong>" + coins + "</strong>");
      log("🚀 Should bypass: <strong>" + (coins >= CONFIG.MIN_COINS) + "</strong>");

      const modals = [];
      for (var i = 0; i < CONFIG.MODAL_SELECTORS.length; i++) {
        var selector = CONFIG.MODAL_SELECTORS[i];
        var found = mynovelTab.document.querySelectorAll(selector);
        for (var j = 0; j < found.length; j++) {
          var el = found[j];
          modals.push(el);
          var text = el.textContent ? el.textContent.substring(0, 40) : '';
          log("  ✅ Found modal: " + selector + " → " + el.tagName + " \"" + text + "\"");
        }
      }
      log("🔍 Total modals found: <strong>" + modals.length + "</strong>");

      if (modals.length === 0) {
        log("⚠️ No modals detected. Try opening a new tab on mynovel.co first.");
        setStatus("No modals found", "warning");
        return;
      }

      if (coins >= CONFIG.MIN_COINS) {
        log("🔓 Bypass activated! Hiding " + modals.length + " modal(s)...");
        for (var k = 0; k < modals.length; k++) {
          var modal = modals[k];
          hideModal(modal);
          log("  ✅ Hidden modal #" + (k + 1) + ": " + modal.tagName);
        }
        setTimeout(function() {
          setStatus("✅ Bypass successful! Modals hidden.", "success");
        }, 500);
      } else {
        log("⚠️ Coins (" + coins + ") < " + CONFIG.MIN_COINS + ". Bypass skipped.");
        setTimeout(function() {
          setStatus("⚠️ Coins too low. Try with 10+ coins.", "warning");
        }, 500);
      }
    }, 1000);
  }

  function startObserver() {
    const options = { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style", "data-modal"] };
    observer = new MutationObserver(function(records) {
      if (!shouldBypass() || isBypassed) return;
      for (var i = 0; i < records.length; i++) {
        var record = records[i];
        var added = record.addedNodes;
        for (var j = 0; j < added.length; j++) {
          var node = added[j];
          if (node.nodeType === 1) {
            for (var k = 0; k < CONFIG.MODAL_SELECTORS.length; k++) {
              var selector = CONFIG.MODAL_SELECTORS[k];
              if (node.matches(selector)) {
                log("🆕 New modal detected: " + node.tagName);
                if (shouldBypass() && !isBypassed) {
                  hideModal(node);
                  log("  ✅ Auto-hidden new modal");
                  isBypassed = true;
                }
                break;
              }
            }
          }
        }
      }
    });
    observer.observe(mynovelTab.document.documentElement, options);
    log("👁️ MutationObserver active on mynovel.co tab", "success");
  }

  function runTest() {
    document.getElementById("results").innerHTML = "";
    isBypassed = false;
    if (observer) observer.disconnect();
    observer = null;
    if (bypassScript) {
      bypassScript.remove();
      bypassScript = null;
      bypassScriptNode = null;
    }
    setStatus("Initializing...", "info");

    setTimeout(function() {
      switchToMynovel();
      setTimeout(function() {
        injectBypassScript();
      }, 500);
    }, 500);
  }

  window.toggleBypass = function(force) {
    isBypassed = force;
    if (force) {
      if (getCoinCount() >= CONFIG.MIN_COINS) {
        modals.forEach(function(m) {
          hideModal(m);
        });
        log("Manual toggle: Modals hidden.", "success");
        setStatus("✅ Manual bypass", "success");
      }
    } else {
      for (var i = 0; i < modals.length; i++) {
        var m = modals[i];
        m.classList.remove("hidden");
        m.style.display = "";
        m.removeAttribute("aria-hidden");
      }
      log("Manual toggle: Modals restored.", "info");
      setStatus("Modals shown", "info");
    }
  };

  // Auto-run on load
  window.addEventListener("load", function() {
    setTimeout(function() {
      switchToMynovel();
      setTimeout(function() {
        injectBypassScript();
      }, 500);
    }, 500);
  });
})();
</script>

</body>
</html>
